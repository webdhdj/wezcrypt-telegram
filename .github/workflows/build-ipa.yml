# WezCrypt Telegram — IPA build on GitHub-hosted Xcode 27 image
# Upstream release-13.1.2 versions.json requires macOS 27 + Xcode 27.1 + Bazel 9.2.0.
# The `xcode-27` hosted image (GA 2026-10-15) runs macOS 27 on Apple Silicon.
# Signing: upstream's fake-codesigning material is used, producing an UNSIGNED
# IPA (same approach as Telegram's official reproducible-build verification).
# Install it via AltStore/SideStore/Sideloadly re-signing, or rebuild signed
# with real provisioning (docs/BUILD_INSTRUCTIONS.md).
# API credentials: repo secrets WEZCRYPT_API_ID / WEZCRYPT_API_HASH /
# WEZCRYPT_TEAM_ID. Without them, numeric placeholders are used: the build can
# succeed but the resulting app CANNOT log in to Telegram. Set the secrets
# (from https://my.telegram.org/apps) and re-run for a usable IPA.
name: build-ipa

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number"
        default: "100001"

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 350
    steps:
      - name: Environment inventory
        run: |
          sw_vers
          ls /Applications | grep -i xcode || true
          # Select the newest Xcode 27.x available on the image
          NEWEST=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST/Contents/Developer"; fi
          xcodebuild -version
          df -h .
          sysctl -n hw.memsize; sysctl -n hw.ncpu

      - name: Checkout upstream Telegram-iOS (pinned release-13.1.2)
        run: |
          git clone --recursive https://github.com/TelegramMessenger/Telegram-iOS.git src
          cd src && git checkout release-13.1.2 && git submodule update --init --recursive
          git log -1 --format='%H %s'

      - name: Checkout WezCrypt Telegram tooling
        uses: actions/checkout@v4
        with:
          path: wezcrypt

      - name: Apply customization
        env:
          WEZCRYPT_API_ID: ${{ secrets.WEZCRYPT_API_ID }}
          WEZCRYPT_API_HASH: ${{ secrets.WEZCRYPT_API_HASH }}
          WEZCRYPT_TEAM_ID: ${{ secrets.WEZCRYPT_TEAM_ID }}
        run: |
          # Placeholder fallbacks so the pipeline can run before secrets are set.
          # An IPA built with these CANNOT log in — it is a pipeline verification.
          export WEZCRYPT_API_ID="${WEZCRYPT_API_ID:-1000000}"
          export WEZCRYPT_API_HASH="${WEZCRYPT_API_HASH:-00000000000000000000000000000000}"
          export WEZCRYPT_TEAM_ID="${WEZCRYPT_TEAM_ID:-TEAMID0000}"
          python3 wezcrypt/scripts/customize.py src
          cd src && git diff --stat

      - name: Verify patch scope (no ad/MTProto/crypto changes)
        run: |
          cd src && git add -A && git diff --cached > /tmp/w.diff; git reset -q
          bash ../wezcrypt/scripts/verify-no-forbidden-changes.sh /tmp/w.diff

      - name: Free disk space
        run: |
          sudo rm -rf /Applications/Xcode_26*.app 2>/dev/null || true
          rm -rf ~/Library/Developer/Xcode/DerivedData/* 2>/dev/null || true
          df -h .

      - name: Generate Xcode project (configuration sanity)
        run: |
          cd src
          python3 build-system/Make/Make.py --cacheDir="$HOME/telegram-bazel-cache" \
            generateProject --configurationPath=build-system/wezcrypt-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            2>&1 | tee /tmp/generate.log

      - name: Build release_arm64 (fake codesigning -> unsigned IPA)
        run: |
          cd src
          python3 build-system/Make/Make.py --cacheDir="$HOME/telegram-bazel-cache" \
            build --configurationPath=build-system/wezcrypt-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber=${{ inputs.build_number }} \
            --configuration=release_arm64 \
            2>&1 | tee /tmp/build.log

      - name: Collect IPA
        if: always()
        run: |
          mkdir -p out
          find "$HOME/telegram-bazel-cache" src -name "*.ipa" -not -path "*/node_modules/*" 2>/dev/null | head -5 | while read f; do cp "$f" out/; done
          ls -la out/ || true
          for f in out/*.ipa; do [ -f "$f" ] && shasum -a 256 "$f"; done || true

      - name: Upload artifacts (IPA + logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WezCryptTelegram-build-${{ inputs.build_number }}
          path: |
            out/
            /tmp/generate.log
            /tmp/build.log
          if-no-files-found: warn
          retention-days: 14
