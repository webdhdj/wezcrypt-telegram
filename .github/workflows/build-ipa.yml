# WezCrypt Telegram — IPA build (TEMPLATE, not yet executed)
# Upstream release-13.1.2 versions.json requires macOS 27 + Xcode 27.1.
# GitHub-hosted runners may not offer that combo yet; a self-hosted Mac
# runner labeled [self-hosted, macos, wezcrypt] is the reliable route.
# The job FAILS LOUDLY on Xcode mismatch instead of producing a bad build.
name: build-ipa

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number"
        default: "100001"

jobs:
  build:
    runs-on: [self-hosted, macos]
    steps:
      - name: Check Xcode version (must be 27.1)
        run: |
          VER=$(xcodebuild -version | head -1 | awk '{print $2}')
          echo "Xcode: $VER"
          test "$VER" = "27.1" || { echo "::error::Telegram-iOS release-13.1.2 requires Xcode 27.1, found $VER"; exit 1; }

      - name: Checkout upstream Telegram-iOS (pinned)
        run: |
          git clone --recursive https://github.com/TelegramMessenger/Telegram-iOS.git src
          cd src && git checkout release-13.1.2 && git submodule update --init --recursive

      - name: Checkout WezCrypt Telegram tooling
        uses: actions/checkout@v4
        with:
          path: wezcrypt

      - name: Apply customization
        env:
          WEZCRYPT_API_ID: ${{ secrets.WEZCRYPT_API_ID }}
          WEZCRYPT_API_HASH: ${{ secrets.WEZCRYPT_API_HASH }}
          WEZCRYPT_TEAM_ID: ${{ secrets.WEZCRYPT_TEAM_ID }}
        run: python3 wezcrypt/scripts/customize.py src

      - name: Verify patch scope (no ad/MTProto/crypto changes)
        run: |
          cd src && git diff > /tmp/w.diff
          bash ../wezcrypt/scripts/verify-no-forbidden-changes.sh /tmp/w.diff

      - name: Generate project (simulator check build first)
        run: |
          cd src
          python3 build-system/Make/Make.py --cacheDir="$HOME/telegram-bazel-cache" \
            generateProject --configurationPath=build-system/wezcrypt-configuration.json \
            --xcodeManagedCodesigning --disableProvisioningProfiles

      # Full release build + IPA packaging require provisioning material
      # (secrets-driven) and are intentionally left as the documented manual
      # step in docs/BUILD_INSTRUCTIONS.md until a self-hosted runner with
      # certificates is configured.
